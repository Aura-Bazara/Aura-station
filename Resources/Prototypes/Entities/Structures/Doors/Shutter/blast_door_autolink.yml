# AutoLink variants of BlastDoor (from Outer Rim)

- type: entity
  id: BlastDoorExterior1
  parent: FishBlastDoor # Fish-edit: повышенная прочность
  suffix: Autolink, Ext1
  components:
  - type: AutoLinkReceiver
    channel: Ext1


- type: entity
  id: BlastDoorExterior1Open
