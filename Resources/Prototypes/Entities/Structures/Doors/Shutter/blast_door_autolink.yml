- type: entity
  id: BlastDoorBridge
  parent: FishBlastDoor # Fish-edit: повышенная прочность двери мостика
  suffix: Autolink, Bridge
  components:
    - type: AccessReader
      access: [["Command"]]
      # Sunrise-start
      alertAccesses:
        red: RedAlertAccesses
        blue: BlueAlertAccessesHOS
        gamma: GammaAlertAccesses
      # Sunrise-end
    - type: AutoLinkReceiver
      channel: Bridge

